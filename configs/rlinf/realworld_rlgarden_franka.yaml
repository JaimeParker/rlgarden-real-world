# RLinf `env` block driving rl_garden_real_world's RealRobotEnv (a robot_infra daemon-served
# Franka) through Gymnasium registration. Structure copied from RLinf's
# examples/embodiment/config/env/realworld_peg_insertion.yaml.
#
# Use: merge this as env.train / env.eval of an RLinf real-world SAC config, e.g. in place of
# `env/realworld_peg_insertion@env.train` in
# examples/embodiment/config/realworld_dummy_franka_sac_cnn.yaml (drop that file's
# `env.*.override_cfg` dummy-Franka keys; the cluster `hardware:` block is optional for this id,
# robot_info is ignored).
#   - actor.model.state_dim = sum of the state_fields dims below; RLinf concatenates the state
#     dict in ALPHABETICAL key order (tcp_pose 7 + tcp_vel 6 + gripper_pos 1 = 14 here).
#   - actor.model.action_dim = 7 (cartesian_delta: xyz + rotvec + gripper).
#
# Hazards:
#   - rl_garden_real_world (and rl_garden, robot_infra) must be importable in the Ray env-worker
#     process on the env node (pip install -e, or PYTHONPATH exported before `ray start`):
#     gym.make imports `rl_garden_real_world.rlinf.register`, which registers the id.
#   - RLinf's load_tasks() runs RealWorldEnv.realworld_setup(), which KILLS any roscore /
#     rosmaster / rosout process on the env node. Do not co-locate a ROS master you need.

env_type: real
total_num_envs: 1  # one real robot per env worker

auto_reset: True
ignore_terminations: True
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 100
# RLinf's own episode counter truncates here; leave real_robot.max_episode_steps unset.
max_episode_steps: 100
main_image_key: wrist  # must be one of override_cfg.real_robot.cameras

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "rl_garden_real_world.rlinf.register:RLGardenReal-v0"
  num_envs: null

# Passed (as a plain dict) to rl_garden_real_world.rlinf.register.make_rlinf_env.
override_cfg:
  task_description: "pick up the cube"
  main_image_key: wrist  # same as main_image_key above; checked at env construction
  # none: reward 0.0 every step. classifier: rl-garden success classifier, success -> 1.0
  # (RLinf counts success as reward == 1.0). For classifier add:
  #   classifier: {checkpoint: /path/to/classifier.pt, image_keys: [rgb_wrist],
  #                threshold: 0.5, terminate_on_success: true, device: auto}
  # image_keys use the rl-garden backend names (rgb_<camera>), as in hil_serl training.
  reward: none
  # RealRobotEnvConfig fields (rl_garden_real_world/envs/real_robot/config.py).
  real_robot:
    remote: "ROBOT_PC_IP:50051"  # robot_infra daemon (python -m robot_infra.server ...)
    num_joints: 7
    state_fields: [tcp_pose, tcp_vel, gripper_pos]
    cameras: [wrist]
    image_size: [128, 128]  # required with remote + cameras
    action_mode: cartesian_delta
    control_hz: 10
    # [xmin, ymin, zmin, xmax, ymax, zmax] in metres; placeholder, measure your workspace.
    safety_box: [0.3, -0.2, 0.05, 0.7, 0.2, 0.5]
    # Placeholder Franka ready pose; replace with your task's home configuration.
    home_joints: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
